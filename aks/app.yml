apiVersion: apps/v1
kind: Deployment
metadata:
  name: userinfo-deployment
  labels:
    app: userinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: userinfo
  template:
    metadata:
      labels:
        app: userinfo
    spec:
      containers:
      - name: userinfo-container
        image: 192.168.50.27:5000/atomicacr/usernifo:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: userinfo-service
spec:
  type: LoadBalancer
  selector:
    app: userinfo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80